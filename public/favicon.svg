<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Executive Navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#17233E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Cyan Pulse Accent Gradient -->
    <linearGradient id="cyanGrad" x1="12" y1="46" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1988A3"/>
      <stop offset="60%" stop-color="#11C6DE"/>
      <stop offset="100%" stop-color="#E9EAF7"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11C6DE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1988A3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#17233E" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Drop Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#11C6DE" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Inner Subtle Grid Ambient Accent -->
  <circle cx="50" cy="18" r="14" fill="#11C6DE" fill-opacity="0.12" filter="blur(6px)"/>

  <!-- SkillPulse Trending Graph / Arrow -->
  <g filter="url(#cyanGlow)">
    <!-- Upward Trend Line -->
    <path 
      d="M15 44 L26 31 L35 37 L49 19" 
      fill="none" 
      stroke="url(#cyanGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Arrow Head at (49, 19) -->
    <path 
      d="M37 19 H49 V31" 
      fill="none" 
      stroke="url(#cyanGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Glowing Telemetry Pulse Dot at origin -->
  <circle cx="15" cy="44" r="2.5" fill="#11C6DE"/>
</svg>
